name: CI/CD Pipeline

on:
  push:
    branches: [ci-cd-setup]

# Fix future Node.js warning (optional but recommended)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            cd lottery-frontend

            echo "Switching to SSH for GitHub..."
            git remote set-url origin git@github.com:teens-dev/lottery-frontend.git

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm install

            echo "Building application..."
            npm run build

            echo "Restarting application..."
            pm2 restart lottery-app || pm2 start "npx next start -H 0.0.0.0 -p 3000" --name lottery-app

            echo "Saving PM2 process..."
            pm2 save

            echo "Deployment completed successfully!"
